version: "1.0"
system:
  name: "ai-chan-platform"
  boundary: "ai-frontend, ai-backend (src + llm), ai-infra"
actors:
  - id: ACT-001
    name: "End User"
    type: "human"
    description: "Interacts with website via ai-frontend web UI"
  - id: ACT-002
    name: "System Admin"
    type: "human"
    description: "Manages deployments, configurations, and observability via ai-infra"
external_systems:
  - id: EXT-001
    name: "OpenAI API"
    type: "llm-provider"
  - id: EXT-002
    name: "Google Gemini API"
    type: "llm-provider"
  - id: EXT-003
    name: "Anthropic Claude API"
    type: "llm-provider"
  - id: EXT-004
    name: "Ollama Local Service"
    type: "local-llm"
interactions:
  - from: "End User"
    to: "ai-frontend"
    action: "Web interaction, prompt input, markdown view"
  - from: "ai-frontend"
    to: "ai-backend-src"
    action: "REST API, SSE streaming, session state"
  - from: "ai-backend-src"
    to: "ai-backend-llm"
    action: "Prompt dispatch, tool invocation, token count"
  - from: "ai-backend-llm"
    to: "external_systems"
    action: "API key authenticated chat completions & streaming"
trust_boundaries:
  - id: TB-001
    name: "Internet to Nginx / Ingress"
  - id: TB-002
    name: "Internal Network (Frontend to Backend / DB / Redis)"
  - id: TB-003
    name: "Outbound HTTPS to External LLM Providers"
