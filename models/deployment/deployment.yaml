version: "1.0"
deployment:
  id: DEP-001
  environment: "Production / Staging Dockerized Infrastructure"
  nodes:
    - id: NODE-PROD-01
      type: "Virtual Private Server (VPS) / Cloud Compute"
      os: "Linux Ubuntu 22.04 LTS"
      cpu_cores: 4
      ram_gb: 8
      storage_gb: 80
  workloads:
    - name: "nginx-gateway"
      image: "nginx:1.27-alpine"
      role: "Ingress Gateway & SSL Termination"
      ports: ["80:80", "443:443"]
      security: "Read-only config, TLS 1.3, Rate Limiting"
    - name: "ai-frontend"
      build_context: "ai-frontend"
      role: "Client-facing UI Server (Next.js)"
      internal_port: 3000
    - name: "ai-backend"
      build_context: "ai-backend"
      role: "API & LLM Orchestration Server (FastAPI / Uvicorn)"
      internal_port: 8000
    - name: "postgres"
      image: "postgres:16-alpine"
      role: "Relational Primary Database"
      internal_port: 5432
      volume: "postgres_data"
      healthcheck: "pg_isready -U postgres"
    - name: "redis"
      image: "redis:7-alpine"
      role: "Cache & Rate Limiting Token Store"
      internal_port: 6379
      volume: "redis_data"
  connections:
    - from: "Internet Clients"
      to: "nginx-gateway"
      protocol: "HTTPS / TLS 1.3 (port 443)"
    - from: "nginx-gateway"
      to: "ai-frontend"
      protocol: "HTTP (port 3000)"
    - from: "nginx-gateway"
      to: "ai-backend"
      protocol: "HTTP / SSE (port 8000)"
    - from: "ai-backend"
      to: "postgres"
      protocol: "PostgreSQL Native TCP (port 5432)"
    - from: "ai-backend"
      to: "redis"
      protocol: "Redis TCP (port 6379)"
    - from: "ai-backend"
      to: "External LLM Providers (Google / OpenAI)"
      protocol: "HTTPS (port 443 Outbound)"
  secrets:
    - "JWT_SECRET_KEY"
    - "POSTGRES_PASSWORD"
    - "GEMINI_API_KEY"
    - "OPENAI_API_KEY"
  observability:
    health_endpoint: "/api/v1/health"
    log_format: "JSON Structured Logging (timestamp, level, trace_id, message)"
  source_refs:
    - "ai-infra/compose/docker-compose.yml"
    - "docs/06-architecture/deployment-concept.md"
    - "docs/10-security/security-specification.md"
