version: "1.0"
domain: "development_orchestrator"
id: "DOM-TSK-01"
entities:
  - name: "DevelopmentWorkspace"
    aggregate_root: true
    attributes:
      - id: "string (PK, ws_hex)"
      - user_id: "string (FK -> User.id)"
      - runner_id: "string (FK -> AgentRunner.id, nullable)"
      - name: "string (1..100)"
      - local_path: "string (1..1024, canonicalized host filesystem path)"
      - git_remote_url: "string (nullable)"
      - default_branch: "string (default 'main')"
      - status: "enum(PENDING_VALIDATION, READY, NON_GIT_READY, UNAVAILABLE, DISABLED)"
      - verification_policy: "JSON (test, lint, typecheck, build rules)"
      - last_validated_at: "timestamp"
      - created_at: "timestamp"
      - updated_at: "timestamp"

  - name: "AgentRunner"
    aggregate_root: true
    attributes:
      - id: "string (PK, rnr_hex)"
      - user_id: "string (FK -> User.id)"
      - name: "string (1..100)"
      - machine_name: "string"
      - platform: "enum(windows, darwin, linux)"
      - architecture: "string (x86_64, arm64)"
      - secret_hash: "string (SHA256)"
      - status: "enum(ONLINE, OFFLINE, BUSY, REVOKED)"
      - capabilities: "JSON (installed CLIs: agy, claude, git)"
      - last_heartbeat_at: "timestamp"
      - created_at: "timestamp"
      - updated_at: "timestamp"

  - name: "DevelopmentTask"
    aggregate_root: true
    attributes:
      - id: "string (PK, tsk_hex)"
      - user_id: "string (FK -> User.id)"
      - project_id: "string (FK -> Project.id)"
      - workspace_id: "string (FK -> DevelopmentWorkspace.id)"
      - title: "string (1..200)"
      - prompt: "string (TEXT)"
      - status: "enum(DRAFT, QUEUED, DISPATCHING, PLANNING, AWAITING_APPROVAL, RUNNING, VERIFYING, REVIEW_REQUIRED, COMPLETED, FAILED, CANCELLING, CANCELLED, BLOCKED)"
      - current_attempt_id: "string (FK -> TaskAttempt.id, nullable)"
      - review_status: "enum(PENDING, APPROVED, CHANGES_REQUESTED, REJECTED, default 'PENDING')"
      - idempotency_key: "string (UNIQUE, nullable)"
      - created_at: "timestamp"
      - updated_at: "timestamp"
      - completed_at: "timestamp (nullable)"

  - name: "TaskAttempt"
    aggregate_root: false
    attributes:
      - id: "string (PK, att_hex)"
      - task_id: "string (FK -> DevelopmentTask.id)"
      - attempt_number: "integer (monotonic >= 1)"
      - runner_id: "string (FK -> AgentRunner.id)"
      - runtime: "string (default 'antigravity')"
      - runtime_session_id: "string (conversation_id from CLI, nullable)"
      - mode: "enum(plan, accept-edits)"
      - status: "enum(DISPATCHING, PLANNING, RUNNING, VERIFYING, COMPLETED, FAILED, CANCELLED)"
      - exit_code: "integer (nullable)"
      - duration_seconds: "float (nullable)"
      - tokens_in: "integer (nullable)"
      - tokens_out: "integer (nullable)"
      - cost_estimate: "float (nullable)"
      - git_branch: "string (ai-chan/task-*)"
      - base_commit: "string (40 hex, nullable)"
      - head_commit: "string (40 hex, nullable)"
      - worktree_path: "string (isolated path on runner, nullable)"
      - is_isolated: "boolean (nullable)"
      - diff_stat: "string (TEXT, nullable)"
      - review_feedback: "string (TEXT, nullable)"
      - parent_attempt_id: "string (FK -> TaskAttempt.id, nullable)"
      - started_at: "timestamp"
      - finished_at: "timestamp (nullable)"

  - name: "TaskEvent"
    aggregate_root: false
    attributes:
      - id: "string (PK, evt_hex)"
      - attempt_id: "string (FK -> TaskAttempt.id)"
      - sequence_number: "integer (monotonic per attempt, UNIQUE(attempt_id, sequence_number))"
      - event_type: "string (enum of SPEC-EVT-01)"
      - severity: "enum(DEBUG, INFO, WARN, ERROR, CRITICAL)"
      - payload: "JSON (sanitized)"
      - created_at: "timestamp"

  - name: "TaskArtifact"
    aggregate_root: false
    attributes:
      - id: "string (PK, art_hex)"
      - attempt_id: "string (FK -> TaskAttempt.id)"
      - artifact_type: "enum(plan, diff, verification_report, diagnostic_log, workspace_patch)"
      - file_path: "string (safe relative storage path)"
      - content: "string (TEXT, nullable)"
      - byte_size: "integer"
      - checksum_sha256: "string (nullable)"
      - created_at: "timestamp"

  - name: "TaskApproval"
    aggregate_root: false
    attributes:
      - id: "string (PK, app_hex)"
      - attempt_id: "string (FK -> TaskAttempt.id)"
      - action_type: "enum(plan_approval, diff_review, tool_permission)"
      - decision: "enum(APPROVED, REJECTED, REQUEST_CHANGES)"
      - description: "string (nullable)"
      - decided_by: "string (FK -> User.id)"
      - decided_at: "timestamp"

  - name: "TaskVerificationReport"
    aggregate_root: false
    attributes:
      - id: "string (PK, vrp_hex)"
      - attempt_id: "string (FK -> TaskAttempt.id)"
      - task_id: "string (FK -> DevelopmentTask.id)"
      - step_name: "string (test, lint, typecheck, build)"
      - command: "string"
      - status: "enum(NOT_RUN, PASSED, FAILED, ERROR, SKIPPED_BY_POLICY)"
      - exit_code: "integer"
      - duration_seconds: "float"
      - stdout_preview: "string (TEXT, truncated)"
      - stderr_preview: "string (TEXT, truncated)"
      - created_at: "timestamp"

relationships:
  - from: "User"
    to: "DevelopmentWorkspace"
    type: "one-to-many"
  - from: "AgentRunner"
    to: "DevelopmentWorkspace"
    type: "one-to-many"
  - from: "DevelopmentWorkspace"
    to: "DevelopmentTask"
    type: "one-to-many"
  - from: "DevelopmentTask"
    to: "TaskAttempt"
    type: "one-to-many"
  - from: "TaskAttempt"
    to: "TaskEvent"
    type: "one-to-many"
  - from: "TaskAttempt"
    to: "TaskArtifact"
    type: "one-to-many"
  - from: "TaskAttempt"
    to: "TaskApproval"
    type: "one-to-many"
  - from: "TaskAttempt"
    to: "TaskVerificationReport"
    type: "one-to-many"
  - from: "TaskAttempt"
    to: "TaskAttempt"
    type: "self-referential (parent_attempt_id for follow-up review attempts)"
