version: "1.0"
entities:
  - name: "User"
    aggregate_root: true
    attributes:
      - id: "UUID (PK)"
      - email: "string (UNIQUE, RFC 5322)"
      - full_name: "string"
      - hashed_password: "string (bcrypt)"
      - username: "string (UNIQUE, Slug)"
      - avatar_url: "string (HTTPS URL)"
      - bio: "string (max 500)"
      - phone_number: "string"
      - theme_preference: "enum(DARK, LIGHT, SYSTEM)"
      - language_preference: "enum(vi, en)"
      - status: "enum(ACTIVE, DISABLED)"
      - discord_id: "string (UNIQUE, nullable)"
      - discord_username: "string (nullable)"
      - last_login_at: "timestamp"
      - password_changed_at: "timestamp"
      - created_at: "timestamp"
      - updated_at: "timestamp"
  - name: "Conversation"
    aggregate_root: true
    attributes:
      - id: "UUID (PK)"
      - user_id: "UUID (FK -> User.id)"
      - title: "string"
      - created_at: "timestamp"
      - updated_at: "timestamp"
  - name: "Message"
    aggregate_root: false
    attributes:
      - id: "UUID (PK)"
      - conversation_id: "UUID (FK -> Conversation.id)"
      - role: "enum(USER, ASSISTANT)"
      - content: "string"
      - model_used: "string (FK -> AgentModel.id)"
      - created_at: "timestamp"
  - name: "AgentModel"
    aggregate_root: true
    attributes:
      - id: "string (PK, e.g. gemini-3.8-flash, claude-3-7-sonnet)"
      - name: "string (Display Name)"
      - provider: "enum(GOOGLE, ANTHROPIC, OPENAI, GROQ, OLLAMA)"
      - status: "enum(ACTIVE, INACTIVE, DEGRADED, ARCHIVED)"
      - is_default: "boolean"
      - context_window: "integer"
      - max_tokens: "integer"
      - supports_streaming: "boolean"
      - latency_ms: "integer (nullable)"
      - last_checked_at: "timestamp (nullable)"
      - created_at: "timestamp"
      - updated_at: "timestamp"
  - name: "ApiMetricLog"
    aggregate_root: false
    attributes:
      - id: "UUID (PK)"
      - user_id: "UUID (FK -> User.id, nullable for guest)"
      - endpoint: "string (e.g. /api/v1/chat/stream)"
      - http_method: "string (GET, POST, PATCH)"
      - status_code: "integer"
      - latency_ms: "float"
      - ttft_ms: "float (nullable)"
      - prompt_tokens: "integer"
      - completion_tokens: "integer"
      - total_tokens: "integer"
      - model_used: "string (FK -> AgentModel.id, nullable)"
      - ip_address: "string (hashed/redacted)"
      - created_at: "timestamp"
  - name: "UserQuota"
    aggregate_root: true
    attributes:
      - id: "UUID (PK)"
      - user_id: "UUID (FK -> User.id, UNIQUE)"
      - daily_token_limit: "integer (default 100000)"
      - daily_tokens_used: "integer (default 0)"
      - rpm_limit: "integer (default 30)"
      - status: "enum(NORMAL, WARNING_80, EXCEEDED_THROTTLED)"
      - reset_at: "timestamp"
      - created_at: "timestamp"
      - updated_at: "timestamp"
  - name: "DiscordBotConfig"
    aggregate_root: true
    attributes:
      - id: "UUID (PK)"
      - user_id: "UUID (FK -> User.id)"
      - scope: "enum(USER_DM, GUILD)"
      - guild_id: "string (nullable, Discord Guild ID)"
      - guild_name: "string (nullable)"
      - preferred_model_id: "string (FK -> AgentModel.id)"
      - trigger_mode: "enum(MENTION, PREFIX, SLASH_COMMAND)"
      - custom_prefix: "string (max 10, default '!ai')"
      - system_prompt: "string (max 2000, nullable)"
      - max_tokens_per_response: "integer (default 1000, 256..2048)"
      - is_enabled: "boolean (default 1)"
      - sync_to_web: "boolean (default 1)"
      - created_at: "timestamp"
      - updated_at: "timestamp"
  - name: "SystemPrompt"
    aggregate_root: true
    attributes:
      - id: "string (PK, sp_hex)"
      - user_id: "UUID / string (FK -> User.id)"
      - name: "string (1..100, UNIQUE per user)"
      - description: "string (max 500, nullable)"
      - content: "string (TEXT, 1..10000)"
      - created_at: "timestamp"
      - updated_at: "timestamp"
  - name: "Project"
    aggregate_root: true
    attributes:
      - id: "string (PK, proj_hex)"
      - user_id: "UUID / string (FK -> User.id)"
      - name: "string (1..100)"
      - description: "string (max 500, nullable)"
      - model_id: "string (FK -> AgentModel.id)"
      - status: "enum(ACTIVE, STOP, DEACTIVE)"
      - graph_data: "JSON (ProjectGraph: nodes=[InputNode, SystemPromptNode, ModelNode, OutputNode], edges=[data_flow, system_instruction])"
      - created_at: "timestamp"
      - updated_at: "timestamp"
relationships:
  - from: "User"
    to: "Conversation"
    type: "one-to-many"
  - from: "Conversation"
    to: "Message"
    type: "one-to-many"
  - from: "AgentModel"
    to: "Message"
    type: "one-to-many"
  - from: "User"
    to: "ApiMetricLog"
    type: "one-to-many"
  - from: "User"
    to: "UserQuota"
    type: "one-to-one"
  - from: "AgentModel"
    to: "ApiMetricLog"
    type: "one-to-many"
  - from: "User"
    to: "DiscordBotConfig"
    type: "one-to-many"
  - from: "AgentModel"
    to: "DiscordBotConfig"
    type: "one-to-many"
  - from: "User"
    to: "SystemPrompt"
    type: "one-to-many"
  - from: "User"
    to: "Project"
    type: "one-to-many"
  - from: "AgentModel"
    to: "Project"
    type: "one-to-many"
  - from: "Project"
    to: "SystemPrompt"
    type: "many-to-many (via graph node reference prompt_id)"



