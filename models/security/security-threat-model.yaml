version: "1.0"
threat_model:
  id: THREATMODEL-001
  scope: "ai-chan-ingress-and-api-boundary"
  assets:
    - id: ASSET-001
      name: "API Keys & User Credentials in Transit"
    - id: ASSET-002
      name: "Backend Compute & LLM Provider Quotas"
    - id: ASSET-003
      name: "Server Network Bandwidth & Connection Pool"
  entry_points:
    - id: ENTRY-001
      name: "Nginx Ingress (Port 80 HTTP, Port 443 HTTPS)"
    - id: ENTRY-002
      name: "Backend API Router (/api/v1/*)"
  trust_boundaries:
    - id: TB-001
      name: "Public Internet to Nginx Reverse Proxy"
    - id: TB-002
      name: "Nginx to Internal Frontend and Backend Services"
  attacker_capabilities:
    - "Packet sniffing / Man-in-the-Middle on unencrypted networks"
    - "Volumetric HTTP/TCP flooding from single/distributed sources"
    - "Slowloris slow HTTP request starvation"
    - "Large body payload injection to exhaust memory and bandwidth"
  threats:
    - id: THR-001
      name: "Packet Sniffing / MitM Eavesdropping"
      severity: "critical"
      description: "Interception of plain HTTP traffic leaking prompt data and session credentials"
    - id: THR-002
      name: "Layer 7 HTTP Flood & API DDoS"
      severity: "high"
      description: "Exhaustion of backend workers and LLM quotas through high-frequency requests"
    - id: THR-003
      name: "Connection Exhaustion / Slowloris"
      severity: "high"
      description: "Holding connection sockets open indefinitely with slow packet drip"
    - id: THR-004
      name: "Bandwidth Starvation & Large Payload Flooding"
      severity: "medium"
      description: "Sending oversized request bodies or monopolizing download channels"
    - id: THR-005
      name: "Clickjacking & MIME Confusion"
      severity: "medium"
      description: "Framing web portal or exploiting MIME type sniffing"
  controls:
    - id: CTRL-001
      name: "TLS 1.2/1.3 HTTPS & HSTS Redirection"
      threat_ids: ["THR-001"]
      implementation: "Nginx SSL termination with 301 HTTP-to-HTTPS redirect and HSTS header"
    - id: CTRL-002
      name: "Per-IP Rate Limiting Zones"
      threat_ids: ["THR-002"]
      implementation: "Nginx limit_req_zone for API (10r/s burst=20) and Web (30r/s burst=50)"
    - id: CTRL-003
      name: "Connection Limiting & Strict Timeouts"
      threat_ids: ["THR-003"]
      implementation: "Nginx limit_conn_zone (20 conns/IP) + client_body_timeout 10s + keepalive 30s"
    - id: CTRL-004
      name: "Bandwidth Throttling & Payload Caps"
      threat_ids: ["THR-004"]
      implementation: "Nginx limit_rate 2m, limit_rate_after 10m, and client_max_body_size 10M"
    - id: CTRL-005
      name: "Hardened Security Headers"
      threat_ids: ["THR-005"]
      implementation: "X-Frame-Options, X-Content-Type-Options, CSP, and Referrer-Policy"
  source_refs:
    - "ai-infra/docker/nginx/nginx.conf"
    - "ai-infra/compose/docker-compose.yml"
    - "ai-backend/src/core/security.py"
