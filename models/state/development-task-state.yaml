version: "1.0"
state_machine:
  id: "STATE-TSK-01"
  entity: "DevelopmentTask"
  initial_state: "DRAFT"
  terminal_states:
    - "COMPLETED"
    - "FAILED"
    - "CANCELLED"
  states:
    - name: "DRAFT"
      description: "Task record created in database; prompt entered, but not yet submitted for execution."
    - name: "QUEUED"
      description: "Task submitted and queued; awaiting runner lease and pre-flight validation."
    - name: "DISPATCHING"
      description: "Runner has leased task; preparing workspace, branch, and runtime adapter."
    - name: "PLANNING"
      description: "Runner is actively executing Antigravity CLI in plan mode (read-only)."
    - name: "AWAITING_APPROVAL"
      description: "Plan generated; paused waiting for human-in-the-loop plan review."
    - name: "RUNNING"
      description: "Runner is executing changes in accept-edits mode within isolated worktree."
    - name: "VERIFYING"
      description: "Execution complete; runner is executing test, lint, and build verification pipeline."
    - name: "REVIEW_REQUIRED"
      description: "Verification passed; waiting for senior developer code diff review and merge decision."
    - name: "CANCELLING"
      description: "Cancellation signal sent; awaiting runner confirmation of subprocess tree termination."
    - name: "BLOCKED"
      description: "Pre-flight failed, runner offline, or dirty repository blocking execution."
    - name: "COMPLETED"
      description: "Terminal success state; changes accepted and recorded."
    - name: "FAILED"
      description: "Terminal failure state; process crash, timeout, or fatal verification failure."
    - name: "CANCELLED"
      description: "Terminal aborted state; execution cancelled by user or rejected during review."
  transitions:
    - from: "DRAFT"
      to: "QUEUED"
      trigger: "User clicks Dispatch Task"
      guard: "Workspace exists and is ready"
    - from: "DRAFT"
      to: "CANCELLED"
      trigger: "User discards draft"
    - from: "QUEUED"
      to: "DISPATCHING"
      trigger: "Runner claims task lease via /channel"
    - from: "QUEUED"
      to: "BLOCKED"
      trigger: "Queue timeout (5 min) or runner offline"
    - from: "QUEUED"
      to: "CANCELLED"
      trigger: "User cancels queued task"
    - from: "DISPATCHING"
      to: "PLANNING"
      trigger: "Pre-flight passed and mode is plan"
    - from: "DISPATCHING"
      to: "RUNNING"
      trigger: "Pre-flight passed and mode is accept-edits"
    - from: "DISPATCHING"
      to: "FAILED"
      trigger: "Pre-flight workspace validation failed"
    - from: "DISPATCHING"
      to: "CANCELLED"
      trigger: "User cancels dispatching"
    - from: "PLANNING"
      to: "AWAITING_APPROVAL"
      trigger: "Agent emits terminal result with plan markdown"
    - from: "PLANNING"
      to: "FAILED"
      trigger: "Subprocess crash or non-zero exit"
    - from: "PLANNING"
      to: "CANCELLING"
      trigger: "User cancels task execution"
    - from: "AWAITING_APPROVAL"
      to: "RUNNING"
      trigger: "User approves plan (decision APPROVED)"
    - from: "AWAITING_APPROVAL"
      to: "CANCELLED"
      trigger: "User rejects plan (decision REJECTED)"
    - from: "RUNNING"
      to: "VERIFYING"
      trigger: "Subprocess exits 0 and terminal result received in accept-edits mode"
    - from: "RUNNING"
      to: "AWAITING_APPROVAL"
      trigger: "Destructive tool intercepted requiring approval"
    - from: "RUNNING"
      to: "FAILED"
      trigger: "Subprocess crashes or non-zero exit code"
    - from: "RUNNING"
      to: "CANCELLING"
      trigger: "User cancels task execution"
    - from: "VERIFYING"
      to: "REVIEW_REQUIRED"
      trigger: "Verification pipeline completed and diff collected"
    - from: "VERIFYING"
      to: "FAILED"
      trigger: "Fatal verification pipeline failure"
    - from: "REVIEW_REQUIRED"
      to: "COMPLETED"
      trigger: "User reviews diff and accepts changes (ACCEPT/APPROVE)"
    - from: "REVIEW_REQUIRED"
      to: "QUEUED"
      trigger: "User requests changes (REQUEST_CHANGES, spawning follow-up attempt)"
    - from: "REVIEW_REQUIRED"
      to: "CANCELLED"
      trigger: "User rejects changes (REJECT)"
    - from: "CANCELLING"
      to: "CANCELLED"
      trigger: "Subprocess tree killed and cleaned up"
    - from: "FAILED"
      to: "QUEUED"
      trigger: "User retries failed task (new attempt)"
    - from: "CANCELLED"
      to: "QUEUED"
      trigger: "User retries cancelled task (new attempt)"
  source_refs:
    - "ai-backend/src/api/v1/orchestrator.py"
    - "ai-runner/runner.py"
    - "ai-frontend/src/tests/tasksLifecycle.test.ts"
    - "docs/architecture/development-orchestrator/development-task-lifecycle.md"
