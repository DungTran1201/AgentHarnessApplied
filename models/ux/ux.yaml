version: "1.0"
ux_model:
  id: UXMODEL-001
  system_name: "AI-Chan Virtual Assistant"
  actors:
    - id: ACT-01
      name: "Guest"
      description: "Unauthenticated visitor arriving at public landing/login/register pages."
    - id: ACT-02
      name: "Registered User"
      description: "Authenticated user conducting conversations and managing chat history."
  goals:
    - id: GOAL-01
      description: "Register and authenticate securely with minimum friction."
    - id: GOAL-02
      description: "Engage in fluid, real-time AI conversations with rich text and code formatting."
    - id: GOAL-03
      description: "Organize, browse, rename, and delete conversation threads seamlessly."
  information_architecture:
    sitemap:
      - path: "/login"
        title: "Login Page"
        auth_required: false
      - path: "/register"
        title: "Registration Page"
        auth_required: false
      - path: "/chat"
        title: "Main Chat Application"
        auth_required: true
        subsections:
          - "Sidebar: Conversation History & New Chat button"
          - "Top Navigation Bar: Active Thread Title & User Profile Dropdown"
          - "Chat Thread View: Message Stream, Auto-scroll, Typing Indicator"
          - "Prompt Input Box: Multiline Textarea, Token Counter, Send & Stop Actions"
      - path: "/dashboard"
        title: "Real-Time Resource Telemetry & Quota Dashboard"
        auth_required: true
        subsections:
          - "Summary Metrics Bar: Active Requests, Total Tokens, Average Latency, Daily Quota Gauge"
          - "Live Latency Sparkline: TTFT & Total Execution Time Trend (1s tick)"
          - "Token Breakdown Chart: Prompt vs Completion Tokens per Model Provider"
          - "HTTP Status Code Distribution Ring Chart"
          - "Live Request Telemetry Stream Feed Table"
  screens:
    - id: SCR-001
      name: "Authentication View"
      routes: ["/login", "/register"]
      components:
        - "Brand Header / AI-Chan Mascot"
        - "Form Input Fields (Email, Password, Confirm Password)"
        - "Submit Button with Loading Spinner"
        - "Toast Error / Success Notification"
        - "Route Switcher Link"
    - id: SCR-002
      name: "Chat Workspace View"
      routes: ["/chat", "/chat/:conversation_id"]
      components:
        - "Collapsible Sidebar (History items, New Chat, Delete confirmation modal)"
        - "Top Header (Conversation title, Inline rename trigger, User logout)"
        - "Message Feed (User message bubble, AI message bubble with Markdown & Copy code)"
        - "Composer Bar (Auto-resize textarea, Send button, Stop Generation button)"
    - id: SCR-003
      name: "Resource Telemetry & Real-Time Dashboard View"
      routes: ["/dashboard"]
      components:
        - "Live Metric Counter Cards (Latency p95, Token Used, RPM, Error Rate)"
        - "Real-Time Gauge (Daily Token Quota Usage % & Warning State)"
        - "Dynamic Latency & TTFT Line Chart (Powered by live SSE event stream)"
        - "Model Breakdown Bar Chart (Tokens by Gemini, OpenAI, Claude, Groq)"
        - "Recent Live Request Feed with Real-time Status Badges"
    - id: SCR-004
      name: "Agent Model Catalog & Management Canvas View"
      routes: ["/models"]
      components:
        - "Search Bar with Debounced Instant Query Trigger"
        - "Multi-Filter Controls (Provider, Status, Has API Key, Is Default)"
        - "Model Grid / Table with Status Badges and Latency Indicator"
        - "Add New Model Modal Dialog with Parameter Bounds Validation"
        - "Edit Model Configuration Drawer / Modal"
        - "Soft-Delete & Archive Confirmation Modal with Default Protection Guard"
    - id: SCR-005
      name: "User Settings & Connected Accounts View"
      routes: ["/settings", "/settings?tab=connections"]
      components:
        - "Settings Tab Navigation (Profile, Security, Connections, Preferences)"
        - "Connected Social Accounts Grid (Discord Card with Avatar, Tag, Status Badge)"
        - "Connect Discord Action Button with OAuth2 Redirect Trigger"
        - "Disconnect Discord Trigger Button with Confirmation Modal"
        - "Password Re-authentication Modal Dialog (BR-027)"
        - "Account Lockout Warning Alert for Passwordless Users (BR-026)"
    - id: SCR-006
      name: "Discord Bot Management Canvas & Integration View"
      routes: ["/settings?tab=bot", "/settings/bot"]
      components:
        - "Bot Status Overview Card (Online Indicator, Bot ID, Invitation Button)"
        - "Manageable Discord Servers (Guilds) Selector with Installation Badges"
        - "Preferred AI Model Selector (Constrained to ACTIVE models, BR-033)"
        - "Trigger Mode Radios (@Mention, Custom Prefix, Slash Command)"
        - "Custom Prefix Input Field (e.g. !ai)"
        - "System Persona / Custom Prompt Textarea"
        - "Max Tokens Per Response Ceiling Slider (256 - 2048)"
        - "Conversation Sync to Web Toggle Switch"
        - "Emergency Enable / Disable Master Switch"
  flows:
    - id: FLOW-AUTH
      name: "User Authentication Flow"
      screens: ["SCR-001", "SCR-002"]
      trigger: "Guest enters application or initiates logout"
    - id: FLOW-CHAT-STREAM
      name: "Message Prompt & Streaming Response Flow"
      screens: ["SCR-002"]
      trigger: "User submits prompt in Composer Bar"
    - id: FLOW-CONV-MANAGE
      name: "Conversation Lifecycle Management Flow"
      screens: ["SCR-002"]
      trigger: "User creates, renames, selects, or deletes thread"
    - id: FLOW-RESOURCE-MONITOR
      name: "Real-Time Telemetry & Quota Monitoring Flow"
      screens: ["SCR-003"]
      trigger: "User navigates to /dashboard or quota threshold reached"
    - id: FLOW-MODEL-MANAGE
      name: "Agent Model Catalog Registration & Management Flow"
      screens: ["SCR-004"]
      trigger: "User navigates to /models, triggers search/filter, or edits model configurations"
    - id: FLOW-DISCORD-LINK
      name: "Discord Account Linking & Safe Unlinking Flow"
      screens: ["SCR-005"]
      trigger: "User initiates link or unlink action in Settings Connections tab"
    - id: FLOW-BOT-MANAGE
      name: "Discord Bot Management and Guild Integration Flow"
      screens: ["SCR-005", "SCR-006"]
      trigger: "User navigates to Bot Management tab or updates bot configuration"
  requirements:
    - id: UX-001
      title: "Responsive Layout & Dual Theme"
      target: "Seamless presentation across 360px mobile to 1920px desktop."
    - id: UX-002
      title: "Optimistic UI & Dynamic Auto-Scroll"
      target: "Immediate user bubble rendering and synchronized scroll follow-through."
    - id: UX-003
      title: "Streaming Visual Feedback & Abort Control"
      target: "Blinking cursor token generation with immediate stop generation trigger."
    - id: UX-004
      title: "Rich Markdown & Code Syntax Highlighting"
      target: "Full formatting for code snippets with one-click clipboard copy."
    - id: UX-005
      title: "Composer UX & Context Bounds Indicator"
      target: "4000 character boundary warning, Shift+Enter newline, suggestion chips."
    - id: UX-006
      title: "Account Profile & Preferences Management Canvas"
      target: "Multi-tab account preferences, email/password rotation with validation."
    - id: UX-007
      title: "Real-Time Resource Telemetry & Quota Dashboard Interface"
      target: "Interactive live telemetry dashboard with SSE updates, quota warning gauges, and latency charts."
    - id: UX-008
      title: "Interactive Model Catalog Management, Fuzzy Search & Multi-Filter Experience"
      target: "Frictionless model discovery with instant debounced search, responsive facet filtering, and safe configuration mutation modals."
    - id: UX-009
      title: "Connected Social Identity Management & Safe Unlinking Dialog Experience"
      target: "Intuitive connected accounts dashboard with Discord profile presentation, conflict notifications, and password-guarded unlinking modals."
    - id: UX-011
      title: "Discord Bot Multi-Scope Configuration Canvas & Guild Integration UX"
      target: "Unified bot management tab for linked accounts with guild picker, prompt tailoring, active model selection, and token ceiling sliders."
  source_refs:
    - "docs/02-requirements/functional-requirements.md"
    - "docs/02-requirements/non-functional-requirements.md"
    - "docs/04-use-cases/use-case-catalog.md"
    - "docs/08-api/api-specifications.md"


